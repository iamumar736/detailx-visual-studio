name: One-time domain HTTPS diagnostic
on:
  push:
    paths:
      - '.github/workflows/domain-diagnostic.yml'
permissions:
  contents: read
jobs:
  check-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public DNS and TLS without changing settings
        shell: bash
        run: |
          set +e
          echo '=== Domain apex A via Cloudflare ==='
          dig +time=3 +tries=1 +short A detailxitalia.com @1.1.1.1
          echo '=== Domain apex A via Google ==='
          dig +time=3 +tries=1 +short A detailxitalia.com @8.8.8.8
          echo '=== Domain apex AAAA ==='
          dig +time=3 +tries=1 +short AAAA detailxitalia.com @1.1.1.1
          echo '=== Domain CAA ==='
          dig +time=3 +tries=1 +short CAA detailxitalia.com @1.1.1.1
          echo '=== www CNAME ==='
          dig +time=3 +tries=1 +short CNAME www.detailxitalia.com @1.1.1.1
          echo '=== HTTPS apex ==='
          curl -IvLsS --max-time 15 --connect-timeout 6 https://detailxitalia.com/ -o /dev/null 2>&1 | tail -n 48
          echo '=== HTTPS www ==='
          curl -IvLsS --max-time 15 --connect-timeout 6 https://www.detailxitalia.com/ -o /dev/null 2>&1 | tail -n 48
          echo '=== HTTPS Render subdomain ==='
          curl -IsS --max-time 15 https://detailx-visual-studio.onrender.com/ | head -n 12
          echo '=== Test completed ==='
