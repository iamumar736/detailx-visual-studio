name: Verify DetailX DNS and HTTPS
on:
  push:
    paths:
      - '.github/workflows/check-domain-ssl.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify records and HTTPS
        shell: bash
        run: |
          echo "=== Cloudflare apex A ==="
          dig +time=3 +tries=1 +short A detailxitalia.com @1.1.1.1
          echo "=== Google apex A ==="
          dig +time=3 +tries=1 +short A detailxitalia.com @8.8.8.8
          echo "=== Cloudflare apex AAAA ==="
          dig +time=3 +tries=1 +short AAAA detailxitalia.com @1.1.1.1
          echo "=== WWW CNAME ==="
          dig +time=3 +tries=1 +short CNAME www.detailxitalia.com @1.1.1.1
          echo "=== HTTPS apex ==="
          curl -LIsS --max-time 15 --connect-timeout 6 https://detailxitalia.com/ 2>&1 | head -n 28 || true
          echo "=== HTTPS www ==="
          curl -LIsS --max-time 15 --connect-timeout 6 https://www.detailxitalia.com/ 2>&1 | head -n 28 || true
          echo "=== Render original ==="
          curl -IsS --max-time 15 --connect-timeout 6 https://detailx-visual-studio.onrender.com/ 2>&1 | head -n 12 || true
